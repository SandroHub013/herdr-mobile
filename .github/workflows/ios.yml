# The iPhone build. It needs a Mac, and this is the only place there is one:
# it starts when release.mjs publishes a release on GitHub, builds the IPA on a
# macOS runner and attaches it to the same release, next to the APK.
#
# Without secrets the IPA comes out unsigned: whoever receives it signs it with
# their own Apple ID (Sideloadly, AltStore) and installs it. With the secrets
# of an Apple Developer Program the build is signed and, when the method is
# app-store-connect, uploaded to TestFlight. See the README, "iPhone".
name: iOS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the IPA to (empty: workflow artifact only)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  ipa:
    name: IPA
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write # to attach the IPA to the release
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # Signing secrets, all optional. Empty: unsigned build.
      IOS_CERT_P12: ${{ secrets.IOS_CERT_P12 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Tools
        run: |
          xcodebuild -version
          pod --version
          bun --version

      - name: Dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Version
        id: version
        working-directory: app
        run: |
          VERSION="$(node -p "require('./app.json').expo.version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ipa=HerdrMobile-$VERSION-ios.ipa" >> "$GITHUB_OUTPUT"
          echo "Herdr Mobile $VERSION"

      # ios/ is not in the repository: it is generated here from app.json, the
      # way Expo would on a Mac, and the Pods installed on top.
      - name: iOS project
        working-directory: app
        env:
          CI: 1
        run: bun x expo prebuild --platform ios --no-install

      - name: CocoaPods
        working-directory: app/ios
        run: pod install

      # ------------------------------------------------------------- unsigned
      - name: Unsigned build
        if: env.IOS_CERT_P12 == ''
        working-directory: app/ios
        env:
          IPA: ${{ steps.version.outputs.ipa }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace HerdrMobile.xcworkspace \
            -scheme HerdrMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet build
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HerdrMobile.app Payload/
          zip -qr "$GITHUB_WORKSPACE/$IPA" Payload

      # --------------------------------------------------------------- signed
      # Distribution certificate in a temporary keychain; Xcode creates the
      # profiles itself with the App Store Connect key.
      - name: Signing keys
        if: env.IOS_CERT_P12 != ''
        run: |
          set -euo pipefail
          test -n "$IOS_TEAM_ID" || { echo "IOS_TEAM_ID is missing"; exit 1; }
          test -n "$ASC_KEY_ID" -a -n "$ASC_ISSUER_ID" -a -n "$ASC_KEY_P8" || { echo "ASC_KEY_ID, ASC_ISSUER_ID or ASC_KEY_P8 is missing"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$IOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Signed build
        if: env.IOS_CERT_P12 != ''
        working-directory: app/ios
        env:
          IPA: ${{ steps.version.outputs.ipa }}
        run: |
          set -euo pipefail
          METHOD="${IOS_EXPORT_METHOD:-app-store-connect}"
          xcodebuild \
            -workspace HerdrMobile.xcworkspace \
            -scheme HerdrMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HerdrMobile.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            -quiet archive
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath build/HerdrMobile.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -quiet
          mv build/export/*.ipa "$GITHUB_WORKSPACE/$IPA"

      - name: TestFlight
        if: env.IOS_CERT_P12 != '' && (env.IOS_EXPORT_METHOD == '' || env.IOS_EXPORT_METHOD == 'app-store-connect')
        env:
          IPA: ${{ steps.version.outputs.ipa }}
        run: |
          set -euo pipefail
          mkdir -p ~/.private_keys
          cp "$ASC_KEY_PATH" ~/.private_keys/
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # ------------------------------------------------------------- delivery
      - name: Checksum
        env:
          IPA: ${{ steps.version.outputs.ipa }}
        run: |
          set -euo pipefail
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          ls -la "$IPA"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HerdrMobile-${{ steps.version.outputs.version }}-ios
          path: |
            ${{ steps.version.outputs.ipa }}
            ${{ steps.version.outputs.ipa }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IPA: ${{ steps.version.outputs.ipa }}
        run: gh release upload "$TAG" "$IPA" "$IPA.sha256" --clobber
