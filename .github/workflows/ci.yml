# Controlli a ogni push e pull request: i tipi dell'app e la sintassi del
# bridge. Niente build native qui, che costano minuti macOS; quelle stanno
# in ios.yml e partono da una release.
name: Controlli

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: controlli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Dipendenze
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Tipi
        working-directory: app
        run: bun x tsc --noEmit -p .

  bridge:
    name: Bridge (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sintassi
        run: python3 -m py_compile bridge/bridge.py
